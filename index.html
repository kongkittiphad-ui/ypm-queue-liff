<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จองคิวปรึกษา — โยธาธิการและผังเมือง</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1B5E99, #2E86C1); color: white; padding: 20px 16px; text-align: center; }
    .header h1 { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
    .header p  { font-size: 13px; opacity: 0.85; }
    .card { background: white; margin: 16px; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: bold; color: #1B5E99; margin-bottom: 6px; }
    label span.req { color: #e74c3c; margin-left: 4px; }
    input, select, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #dce3ea; border-radius: 8px; font-size: 15px; font-family: 'Sarabun', sans-serif; color: #333; background: #fafafa; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2E86C1; background: white; }
    .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .slot-btn { padding: 10px; border: 1.5px solid #dce3ea; border-radius: 8px; background: #fafafa; font-size: 14px; font-family: 'Sarabun', sans-serif; cursor: pointer; text-align: center; }
    .slot-btn.selected { border-color: #2E86C1; background: #EBF5FB; color: #1B5E99; font-weight: bold; }
    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #1B5E99, #2E86C1); color: white; border: none; border-radius: 10px; font-size: 17px; font-family: 'Sarabun', sans-serif; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading { display: none; text-align: center; padding: 40px 20px; color: #666; }
    .spinner { width: 40px; height: 40px; border: 4px solid #dce3ea; border-top-color: #2E86C1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { display: none; text-align: center; padding: 40px 20px; }
    .success .icon { font-size: 64px; margin-bottom: 16px; }
    .success h2 { color: #1B5E99; margin-bottom: 8px; }
    .success p { color: #666; font-size: 14px; line-height: 1.6; }
    .booking-id { background: #EBF5FB; border-radius: 8px; padding: 10px 16px; margin: 12px 0; font-weight: bold; color: #1B5E99; font-size: 16px; }
    .error-msg { display: none; background: #fdecea; color: #c0392b; border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
    .hint { color: #999; font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🏛️ จองคิวปรึกษา</h1>
  <p>สำนักงานโยธาธิการและผังเมืองจังหวัด</p>
</div>

<div id="formSection">
  <div class="card">
    <div id="errorMsg" class="error-msg"></div>

    <div class="form-group">
      <label>ชื่อ-นามสกุล <span class="req">*</span></label>
      <input type="text" id="fullName" placeholder="กรอกชื่อ-นามสกุล" />
    </div>

    <div class="form-group">
      <label>เบอร์โทรศัพท์ <span class="req">*</span></label>
      <input type="tel" id="phone" placeholder="0xxxxxxxxx" maxlength="10" />
    </div>

    <div class="form-group">
      <label>ประเภทงานที่ต้องการปรึกษา <span class="req">*</span></label>
      <select id="serviceType" onchange="onServiceTypeChange()">
        <option value="">-- เลือกประเภทงาน --</option>
        <option value="งานช่าง">🔧 งานช่าง</option>
        <option value="ผังเมือง">🗺️ ผังเมือง</option>
      </select>
    </div>

    <div class="form-group">
      <label>วันที่ต้องการ <span class="req">*</span></label>
      <input type="date" id="preferredDate" onchange="loadSlots()" />
    </div>

    <div class="form-group">
      <label>ช่วงเวลา <span class="req">*</span></label>
      <div id="slotContainer">
        <p class="hint">กรุณาเลือกประเภทงานและวันที่ก่อนครับ</p>
      </div>
    </div>

    <div class="form-group">
      <label>หมายเหตุ (ถ้ามี)</label>
      <textarea id="notes" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม เช่น เรื่องที่ต้องการปรึกษา"></textarea>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitBooking()">
      📅 ยืนยันการจอง
    </button>
  </div>
</div>

<div id="loadingSection" class="loading card" style="margin:16px;">
  <div class="spinner"></div>
  <p>กำลังส่งข้อมูล กรุณารอสักครู่...</p>
</div>

<div id="successSection" class="success card" style="margin:16px;">
  <div class="icon">✅</div>
  <h2>จองคิวสำเร็จแล้ว!</h2>
  <div class="booking-id" id="bookingIdDisplay"></div>
  <p>ระบบได้รับคำขอของท่านแล้ว<br/>กรุณารอเจ้าหน้าที่ยืนยันนัดหมายผ่าน LINE ครับ/ค่ะ</p>
</div>

<script>
var LIFF_ID  = '2009411953-W4NYD3v1';
var GET_URL  = 'https://script.google.com/macros/s/AKfycbw2yDFOBb5mngDGt8nO6DaYzc8Y8yYTkxW_6vyiaRFDamylIFOUfF1BGQPF_7dkuT31Ww/exec';
var POST_URL = 'https://hook.us2.make.com/8yk8kr6lb2bsm4xqw81g8ntffwfgq8ol';

var lineUserId   = '';
var displayName  = '';
var selectedSlot = '';

async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    var profile = await liff.getProfile();
    lineUserId  = profile.userId;
    displayName = profile.displayName;
  } catch (err) {
    console.error('LIFF init error:', err);
  }
}

async function loadSlots() {
  var date        = document.getElementById('preferredDate').value;
  var serviceType = document.getElementById('serviceType').value;
  if (!date || !serviceType) return;

  document.getElementById('slotContainer').innerHTML =
    '<p class="hint">⏳ กำลังโหลดช่วงเวลาว่าง...</p>';

  try {
    var url = GET_URL
      + '?action=getSlots'
      + '&date=' + date
      + '&serviceType=' + encodeURIComponent(serviceType);

    var res  = await fetch(url, { redirect: 'follow' });
    var text = await res.text();
    var data = JSON.parse(text);
    renderSlots(data.slots);
  } catch (err) {
    console.error('loadSlots error:', err);
    document.getElementById('slotContainer').innerHTML =
      '<p style="color:#e74c3c;font-size:14px;">โหลดช่วงเวลาไม่ได้ กรุณาลองใหม่ครับ</p>';
  }
}

function renderSlots(slots) {
  selectedSlot = '';
  if (!slots || slots.length === 0) {
    document.getElementById('slotContainer').innerHTML =
      '<p style="color:#e74c3c;font-size:14px;">ไม่มีช่วงเวลาว่างในวันที่เลือกครับ/ค่ะ</p>';
    return;
  }
  var html = '<div class="slot-grid">';
  for (var i = 0; i < slots.length; i++) {
    html += '<button class="slot-btn" onclick="selectSlot(this,\'' + slots[i].label + '\')">'
          + slots[i].label + '</button>';
  }
  html += '</div>';
  document.getElementById('slotContainer').innerHTML = html;
}

function selectSlot(btn, label) {
  var btns = document.querySelectorAll('.slot-btn');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('selected'); }
  btn.classList.add('selected');
  selectedSlot = label;
}

function onServiceTypeChange() {
  var date = document.getElementById('preferredDate').value;
  if (date) loadSlots();
}

function generateBookingId() {
  var now  = new Date();
  var yyyy = now.getFullYear();
  var mm   = String(now.getMonth() + 1).padStart(2, '0');
  var dd   = String(now.getDate()).padStart(2, '0');
  var hh   = String(now.getHours()).padStart(2, '0');
  var min  = String(now.getMinutes()).padStart(2, '0');
  return 'BK' + yyyy + mm + dd + '-' + hh + min;
}

function submitBooking() {
  var fullName    = document.getElementById('fullName').value.trim();
  var phone       = document.getElementById('phone').value.trim();
  var serviceType = document.getElementById('serviceType').value;
  var date        = document.getElementById('preferredDate').value;
  var notes       = document.getElementById('notes').value.trim();

  if (!fullName)                 { showError('กรุณากรอกชื่อ-นามสกุลครับ/ค่ะ');        return; }
  if (!phone || phone.length < 9){ showError('กรุณากรอกเบอร์โทรให้ถูกต้องครับ/ค่ะ'); return; }
  if (!serviceType)              { showError('กรุณาเลือกประเภทงานครับ/ค่ะ');          return; }
  if (!date)                     { showError('กรุณาเลือกวันที่ครับ/ค่ะ');              return; }
  if (!selectedSlot)             { showError('กรุณาเลือกช่วงเวลาครับ/ค่ะ');           return; }

  hideError();
  showLoading(true);

  var bookingData = {
    action:        'createBooking',
    lineUserId:    lineUserId,
    displayName:   displayName,
    fullName:      fullName,
    phone:         phone,
    serviceType:   serviceType,
    preferredDate: date,
    preferredSlot: selectedSlot,
    notes:         notes
  };

  fetch(POST_URL, {
    method:  'POST',
    mode:    'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(bookingData)
  }).then(function() {
    showSuccess(generateBookingId());
  }).catch(function(err) {
    console.error('submitBooking error:', err);
    showLoading(false);
    showError('ส่งข้อมูลไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตและลองใหม่ครับ/ค่ะ');
  });
}

function showLoading(show) {
  document.getElementById('formSection').style.display    = show ? 'none' : 'block';
  document.getElementById('loadingSection').style.display = show ? 'block' : 'none';
}

function showSuccess(bookingId) {
  document.getElementById('formSection').style.display    = 'none';
  document.getElementById('loadingSection').style.display = 'none';
  document.getElementById('successSection').style.display = 'block';
  document.getElementById('bookingIdDisplay').textContent = '📋 รหัสการจอง: ' + bookingId;
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent   = '⚠️ ' + msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

function setMinDate() {
  var d   = new Date();
  d.setDate(d.getDate() + 1);
  var yyyy = d.getFullYear();
  var mm   = String(d.getMonth() + 1).padStart(2, '0');
  var dd   = String(d.getDate()).padStart(2, '0');
  document.getElementById('preferredDate').min = yyyy + '-' + mm + '-' + dd;
}

window.addEventListener('load', function() {
  setMinDate();
  initLiff();
});
</script>

</body>
</html>
